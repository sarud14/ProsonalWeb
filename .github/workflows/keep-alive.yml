name: Keep-alive

on:
  schedule:
    # Supabase Free pauses a project that gets fewer than a few database
    # requests each day. Vercel Hobby can only add one ping (vercel.json).
    # 01:00, 07:00, and 13:00 UTC — 08:00, 14:00, and 20:00 Asia/Bangkok.
    - cron: '0 1 * * *'
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production database via /api/health
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$KEEP_ALIVE_URL" ]; then
            echo "Set GitHub repo variable KEEP_ALIVE_URL to the production origin (e.g. https://your-app.vercel.app)."
            exit 1
          fi
          body="$(curl -sS --max-time 30 "${KEEP_ALIVE_URL%/}/api/health")"
          echo "$body"
          ok="$(printf '%s' "$body" | jq -r '.ok')"
          database="$(printf '%s' "$body" | jq -r '.database')"
          if [ "$ok" != "true" ] || [ "$database" != "connected" ]; then
            echo "Keep-alive did not reach Postgres (ok=$ok database=$database)."
            exit 1
          fi
