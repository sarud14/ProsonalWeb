name: CI

on:
  push:
    branches: [Ruj, main]
  pull_request:
    branches: [Ruj, main]

permissions:
  contents: read

jobs:
  notify-start:
    name: First-Notify-Discord
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_STAGE: start
          NOTIFY_TITLE: CI started
          NOTIFY_COLOR: "3447003"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: bash .github/scripts/notify-discord.sh

  check:
    name: Run-Node-Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: yarn prisma generate

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn type-check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  e2e:
    name: E2E-Tests
    needs: check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      CONTENT_SOURCE: db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Push database schema
        run: yarn prisma db push

      - name: Build
        run: yarn build

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests
        run: yarn test:e2e

  notify-ready:
    name: Deploy-Notify-Discord
    needs: [check, e2e]
    if: success()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_STAGE: ready
          NOTIFY_COLOR: "5793266"
          CHECK_RESULT: ${{ needs.check.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            export NOTIFY_TITLE="Tests passed — deploying production"
            export DEPLOY_ENV="Production"
          else
            export NOTIFY_TITLE="Tests passed — deploying preview"
            export DEPLOY_ENV="Preview"
          fi
          bash .github/scripts/notify-discord.sh

  vercel-production:
    name: Vercel-Production
    needs: [check, e2e, notify-ready]
    if: ${{ always() && needs.check.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID GitHub secrets."
            echo "Add them under Settings → Secrets and variables → Actions before this job can deploy."
            exit 1
          fi

          npm install --global vercel@59.15.1

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee /dev/stderr | tail -n 1)
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tee /dev/stderr | tail -n 1)
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

  notify-done:
    name: Second-Notify-Discord
    needs: [check, e2e, notify-ready, vercel-production]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_STAGE: done
          CHECK_RESULT: ${{ needs.check.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VERCEL_RESULT: ${{ needs.vercel-production.result }}
          DEPLOY_URL: ${{ needs.vercel-production.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          if [ "$CHECK_RESULT" = "success" ] && [ "$E2E_RESULT" = "success" ] && [ "$VERCEL_RESULT" = "success" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              export NOTIFY_TITLE="Production is live"
            else
              export NOTIFY_TITLE="Preview is ready"
            fi
            export NOTIFY_COLOR="3066993"
          elif [ "$VERCEL_RESULT" = "failure" ]; then
            export NOTIFY_TITLE="Vercel deploy failed"
            export NOTIFY_COLOR="15158332"
          else
            export NOTIFY_TITLE="CI failed"
            export NOTIFY_COLOR="15158332"
          fi
          bash .github/scripts/notify-discord.sh
